name: Hisoka CI

on:
  push:
    branches: ["main", "release/campaign"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Prettier format check
        run: pnpm run format:check

  circuits:
    name: Circuits (Noir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-nargo
      - uses: ./.github/actions/setup-bb
      # Every step with logic runs a script under scripts/, so a local mirror runs the same code as this file.
      - name: Check circuit formatting
        working-directory: packages/circuits
        run: nargo fmt --check
      - name: Test circuits
        run: bash scripts/ci/circuits-test.sh
      - name: Circuit regression guards
        run: bash scripts/circuit-guards.sh
      - name: Vendored noir-edwards tests
        run: bash scripts/ci/edwards-vendored.sh
      - name: VK byte-identity (recompile, re-derive every VK, compare to the committed pins)
        run: bash scripts/check-vk-identity.sh
      - name: Check soundness harness formatting
        run: bash scripts/ci/harness-fmt.sh
      - name: Witness-injection soundness harnesses
        run: bash scripts/run-forgery-harnesses.sh --reject-only

  ts-tests:
    name: TS Tests
    runs-on: ubuntu-latest
    # vitest and turbo colourise on CI, and the exact-count assertions in scripts/ci match on literal spaces.
    # The scripts also set NO_COLOR and strip escape codes themselves, so a local run matches the same way.
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: ./.github/actions/setup-nargo
      # Foundry is REQUIRED here even though this job runs no forge command: pss-integration's
      # spentOracle suite spawns `anvil` directly (src/__tests__/spentOracle.test.ts:165). Removing this
      # because "no step in this job uses forge" breaks that suite with `spawn anvil ENOENT`.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Check Node version
        run: bash scripts/check-node.sh
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm turbo run build --filter=@hisoka/wallets --filter=@hisoka/adaptors --filter=@hisoka/prover --filter=@hisoka/pss-client --filter=@hisoka/pss-server --filter=@hisoka/howl-protocol
      # Each test step requires the exact passed and skipped counts pinned in scripts/ci/lib/test-counts.sh.
      - name: Typecheck TS packages
        run: bash scripts/ci/typecheck.sh
      - name: Test howl-protocol
        run: bash scripts/ci/test-package.sh howl-protocol
      - name: Test howl-protocol exports
        run: pnpm --filter @hisoka/howl-protocol run test:exports
      - name: Browser bundle gate (howl-protocol)
        run: pnpm --filter @hisoka/howl-protocol run test:bundle
      - name: Test wallets
        run: bash scripts/ci/test-package.sh wallets
      - name: Test adaptors
        run: bash scripts/ci/test-package.sh adaptors
      - name: Test prover
        run: bash scripts/ci/test-package.sh prover
      # The seam Raven has to satisfy. Pure TS, no proofs.
      - name: Test howl-e2e (discovery seam)
        run: bash scripts/ci/test-package.sh howl-e2e
      # Resolves @hisoka/wallets and @hisoka/howl-protocol through dist, which the build step above produced.
      - name: Test wallet-runtime
        run: bash scripts/ci/test-package.sh wallet-runtime
      # Bundle-only: proves the crypto core still resolves for a browser target, which is what breaks when a
      # node-only import lands in it. The Chromium runtime-parity run (test:browser) is deliberately not here; it
      # costs a browser download to re-prove a property that only changes when this bundle step would already fail.
      - name: Browser bundle gate (wallets)
        run: pnpm --filter @hisoka/wallets run test:bundle
      - name: Test pss-client
        run: bash scripts/ci/test-package.sh pss-client
      - name: Test pss-server
        run: bash scripts/ci/test-package.sh pss-server
      - name: Test pss-integration
        run: bash scripts/ci/test-pss-integration.sh

  kage-native-gate:
    name: Kage native VK-pin gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: ./.github/actions/setup-nargo
      - uses: ./.github/actions/setup-bb
      - run: pnpm install --frozen-lockfile
      - name: Toolchain and dependency pins
        run: bash scripts/check-deps.sh --ci --post-install
      - name: Build prover
        run: pnpm turbo run build --filter=@hisoka/wallets --filter=@hisoka/prover
      - name: Run gate (must execute, never skip)
        run: bash scripts/ci/kage-native.sh
      - name: Forgery accept-path controls, all 3 harnesses (must execute, never skip)
        run: bash scripts/ci/forgery-accept.sh

  evm-tests:
    name: EVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: ./.github/actions/setup-nargo
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo run build
      - name: Typecheck evm-contracts (scripts + tests)
        run: pnpm --filter evm-contracts run typecheck
      - name: Run Solidity tests
        run: bash scripts/ci/evm-suite.sh test:fast
      - name: Run slow Solidity tests
        run: bash scripts/ci/evm-suite.sh test:slow
      - name: Gas regression guard (per-entrypoint, Kage settlement and frontier-tree ceilings)
        run: bash scripts/ci/evm-gas.sh
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - name: Run invariant tests (Foundry)
        run: bash scripts/ci/evm-invariant.sh
      - name: Validate upgrade safety
        run: pnpm --filter evm-contracts run validate:upgrades
      - name: Check storage-layout snapshots
        run: pnpm --filter evm-contracts run storage:check

  fork-tests:
    name: Adaptor Tests (mainnet fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
      - uses: ./.github/actions/setup-nargo
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo run build
      - name: Run adaptor tests against a mainnet fork (must execute, never skip)
        env:
          MAINNET_FORK_URL: ${{ secrets.MAINNET_FORK_URL }}
        run: bash scripts/ci/evm-fork.sh

  security:
    name: Secrets + Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan (Trufflehog)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-ignore-paths
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Advisory only, and named so: `|| true` means this can never fail the build. It is a report for a
      # human to read, not a gate. Promoting it to blocking is a deliberate call, because a fresh upstream
      # advisory would then stop unrelated work.
      - name: Dependency audit (prod deps, high severity) [advisory, non-blocking]
        run: pnpm audit --prod --audit-level high || true
