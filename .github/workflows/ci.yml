name: Hisoka CI

on:
  push:
    branches: ["main", "release/campaign"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Prettier format check
        run: pnpm run format:check

  circuits:
    name: Circuits (Noir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v 1.0.0-beta.22
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
      - name: Check circuit formatting
        working-directory: packages/circuits
        run: nargo fmt --check
      - name: Test circuits
        working-directory: packages/circuits
        run: nargo test
      - name: Circuit regression guards
        run: bash scripts/circuit-guards.sh
      - name: Witness-injection soundness harnesses
        run: |
          for h in frost-forgery psi-cek-forgery leaf-index-forgery; do
            echo "::group::$h"
            ( cd "packages/prover/test-harness/$h" && ./check-byte-identity.sh && nargo test ) \
              || { echo "::error::soundness harness $h failed"; exit 1; }
            echo "::endgroup::"
          done

  ts-tests:
    name: TS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v 1.0.0-beta.22
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check Node version
        run: bash scripts/check-node.sh
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm turbo run build --filter=@hisoka/wallets --filter=@hisoka/adaptors --filter=@hisoka/prover --filter=@hisoka/pss-client --filter=@hisoka/pss-server
      - name: Typecheck TS packages
        run: |
          out="$(pnpm turbo run typecheck --filter=@hisoka/pss-client --filter=@hisoka/pss-server --filter=@hisoka/pss-integration --force 2>&1)" || rc=$?
          echo "$out"
          test "${rc:-0}" -eq 0 || { echo "::error::typecheck exited ${rc}"; exit 1; }
          # turbo exits 0 when a package lacks the task, so assert the measured count instead. Three
          # typecheck tasks plus the three builds their ^build dependency pulls in.
          echo "$out" | grep -qE "Tasks: +6 successful, 6 total" \
            || { echo "::error::expected 6 typecheck tasks; a filter or a package script is missing"; exit 1; }
      - name: Test wallets
        run: pnpm --filter @hisoka/wallets run test
      - name: Test adaptors
        run: pnpm --filter @hisoka/adaptors run test
      - name: Test prover
        run: pnpm --filter @hisoka/prover run test
      - name: Test pss-client
        run: |
          out="$(pnpm --filter @hisoka/pss-client run test 2>&1)" || rc=$?
          echo "$out"
          test "${rc:-0}" -eq 0 || { echo "::error::pss-client tests exited ${rc}"; exit 1; }
          # pnpm exits 0 when the filter matches nothing and when the script is missing, so a green
          # step is not evidence the suite ran. Assert a non-zero pass count.
          # Exact, not a wildcard: vitest prints "Tests N passed | M skipped" and exits 0, so a
          # partially skipped suite would satisfy a [0-9]+ match while covering less than it claims.
          echo "$out" | grep -qE "Tests +191 passed \(191\)" \
            || { echo "::error::pss-client did not report exactly 191 passing tests"; exit 1; }
      - name: Test pss-server
        run: |
          out="$(pnpm --filter @hisoka/pss-server run test 2>&1)" || rc=$?
          echo "$out"
          test "${rc:-0}" -eq 0 || { echo "::error::pss-server tests exited ${rc}"; exit 1; }
          echo "$out" | grep -qE "Tests +103 passed \(103\)" \
            || { echo "::error::pss-server did not report exactly 103 passing tests"; exit 1; }
      - name: Test pss-integration
        run: |
          # Through turbo, not pnpm --filter, so `test.dependsOn: ["^build"]` rebuilds pss-client and
          # pss-server first. This suite resolves them through dist, so a pnpm --filter run would grade
          # whatever bundle happened to be on disk.
          out="$(pnpm turbo run test --filter=@hisoka/pss-integration --force 2>&1)" || rc=$?
          echo "$out"
          test "${rc:-0}" -eq 0 || { echo "::error::pss-integration tests exited ${rc}"; exit 1; }
          echo "$out" | grep -qE "Tests +12 passed \(12\)" \
            || { echo "::error::pss-integration did not report exactly 12 passing tests"; exit 1; }
          echo "$out" | grep -qE "Tasks: +4 successful, 4 total" \
            || { echo "::error::expected 4 turbo tasks; a build dependency is missing"; exit 1; }

  kage-native-gate:
    name: Kage native VK-pin gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v 1.0.0-beta.22
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
      - name: Install native bb 5.0.0
        run: |
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          export PATH="$HOME/.bb:$PATH"
          bbup -v 5.0.0
          echo "$HOME/.bb" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - name: Build prover
        run: pnpm turbo run build --filter=@hisoka/wallets --filter=@hisoka/prover
      - name: Run gate (must execute, never skip)
        run: |
          test -x "$HOME/.bb/bb" || { echo "::error::native bb not installed at ~/.bb/bb"; exit 1; }
          "$HOME/.bb/bb" --version | grep -q '5.0.0' || { echo "::error::native bb is not 5.0.0"; exit 1; }
          rc=0
          out="$(KAGE_NATIVE=1 pnpm --filter @hisoka/prover run test:native 2>&1)" || rc=$?
          echo "$out"
          echo "$out" | grep -q 'skipping (not passing)' && { echo "::error::Kage native gate SKIPPED"; exit 1; }
          echo "$out" | grep -q 'opt-in only' && { echo "::error::gate did not receive KAGE_NATIVE=1"; exit 1; }
          echo "$out" | grep -qE '1 passed' || { echo "::error::gate did not report a passing assertion"; exit 1; }
          exit "$rc"
      - name: Forgery accept-path controls, all 3 harnesses (must execute, never skip)
        run: |
          test -x "$HOME/.bb/bb" || { echo "::error::native bb not installed at ~/.bb/bb"; exit 1; }
          "$HOME/.bb/bb" --version | grep -q '5.0.0' || { echo "::error::native bb is not 5.0.0"; exit 1; }
          # The circuits job runs each harness's reject battery. Only this step proves the UN-ABLATED
          # harness still yields a bb-verifying proof, so a reject battery cannot pass by rejecting
          # everything. `out=$(cmd)` under bash -e aborts at the assignment when cmd fails, so a separate
          # `rc=$?` line would never run; capture the status in the same command instead.
          rc=0
          out="$(bash scripts/run-forgery-harnesses.sh 2>&1)" || rc=$?
          echo "$out"
          test "$rc" -eq 0 || { echo "::error::forgery harness runner exited $rc"; exit 1; }
          echo "$out" | grep -q 'all 3 harnesses PASS' || { echo "::error::runner did not reach its all-3-pass assertion"; exit 1; }
          test "$(echo "$out" | grep -c 'Proof verified successfully')" -ge 3 \
            || { echo "::error::fewer than 3 accept paths reported a verified proof"; exit 1; }

  evm-tests:
    name: EVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v 1.0.0-beta.22
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo run build
      - name: Typecheck evm-contracts (scripts + tests)
        run: pnpm --filter evm-contracts run typecheck
      - name: Run Solidity tests
        run: pnpm --filter evm-contracts run test:fast
      - name: Run slow Solidity tests
        run: pnpm --filter evm-contracts run test:slow
      - name: Gas regression guard (per-entrypoint ceilings)
        run: |
          # The bench self-skips without GAS_BENCH=1, so assert it actually ran rather than trusting exit 0.
          rc=0
          out="$(GAS_BENCH=1 pnpm --filter evm-contracts exec hardhat test test/benchmark/Gas.bench.ts 2>&1)" || rc=$?
          echo "$out"
          test "$rc" -eq 0 || { echo "::error::gas guard exited $rc"; exit 1; }
          echo "$out" | grep -qE '10 passing' || { echo "::error::gas guard did not run all 10 entrypoints"; exit 1; }
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run invariant tests (Foundry)
        run: pnpm --filter evm-contracts run test:invariant
      - name: Validate upgrade safety
        run: pnpm --filter evm-contracts run validate:upgrades
      - name: Check storage-layout snapshots
        run: pnpm --filter evm-contracts run storage:check

  fork-tests:
    name: Adaptor Tests (mainnet fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Nargo
        run: |
          curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v 1.0.0-beta.22
          echo "$HOME/.nargo/bin" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo run build
      - name: Run adaptor tests against a mainnet fork (must execute, never skip)
        env:
          MAINNET_FORK_URL: ${{ secrets.MAINNET_FORK_URL }}
        run: |
          # test/adaptors runs in NO other job: hardhat binds it to the test:fork task. Fail loudly on a
          # missing secret rather than skipping, because a skipped job reads as a passing gate.
          test -n "$MAINNET_FORK_URL" \
            || { echo "::error::MAINNET_FORK_URL secret is not set; the adaptor suite cannot run"; exit 1; }
          rc=0
          out="$(pnpm --filter evm-contracts run test:fork 2>&1)" || rc=$?
          echo "$out"
          test "$rc" -eq 0 || { echo "::error::adaptor fork suite exited $rc"; exit 1; }
          echo "$out" | grep -qE '[0-9]+ passing' || { echo "::error::fork suite reported no passing tests"; exit 1; }

  security:
    name: Secrets + Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-ignore-paths
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependency audit (prod deps, high severity)
        run: pnpm audit --prod --audit-level high || true

