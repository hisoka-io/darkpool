name: Nox Paid E2E

# A private note pays a Nox exit to submit a transaction, end to end: real Sphinx mesh, real proofs,
# real contracts on Anvil. The nightly builds main of hisoka-io/nox and hisoka-io/nox-sdk; pull requests
# and manual runs build the commits pinned below unless a manual run names others.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      nox_ref:
        description: "hisoka-io/nox commit (full SHA); empty uses the pin"
        required: false
        type: string
      sdk_ref:
        description: "hisoka-io/nox-sdk commit (full SHA); empty uses the pin"
        required: false
        type: string
  pull_request:
    branches: ["main"]
    paths:
      - "packages/evm-contracts/test/nox/**"
      - "packages/evm-contracts/test/helpers/TestWallet.ts"
      - "packages/adaptors/src/executor/**"
      - ".github/workflows/nox-paid-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NOX_PIN: 3ef92f06f8265700b7b07e9e21e8f6dff0f47a09
  # Has to export executePaid, planPaidGas, paidExecuteCalldata and rpcChainReader.
  NOX_SDK_PIN: d98ea98e30f733bbe319dd0441e98f313418c9cc
  EXPECTED_PASSING: "4"
  # The nox checkout builds for the local CPU; runners differ, so cached artifacts need a fixed baseline.
  NOX_RUSTFLAGS: "-C target-cpu=x86-64-v2"
  MIN_FREE_DISK_GB: "10"
  NO_COLOR: "1"

jobs:
  paid-e2e:
    name: Paid mesh end to end
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require free disk
        run: |
          free_gb="$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          echo "free disk: ${free_gb} GB"
          test "$free_gb" -ge "$MIN_FREE_DISK_GB" \
            || { echo "::error::${free_gb} GB free, the release build and the prover toolchain need ${MIN_FREE_DISK_GB} GB"; exit 1; }

      - name: Resolve the nox and nox-sdk commits
        env:
          NOX_INPUT: ${{ inputs.nox_ref }}
          SDK_INPUT: ${{ inputs.sdk_ref }}
        run: |
          main_of() { git ls-remote "https://github.com/hisoka-io/$1" refs/heads/main | cut -f1; }
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            nox="$(main_of nox)"
            sdk="$(main_of nox-sdk)"
          else
            nox="${NOX_INPUT:-$NOX_PIN}"
            sdk="${SDK_INPUT:-$NOX_SDK_PIN}"
          fi
          for sha in "$nox" "$sdk"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::expected a full commit SHA, got '$sha'"; exit 1; }
          done
          echo "nox ${nox}, nox-sdk ${sdk}"
          echo "NOX_REF=${nox}" >> "$GITHUB_ENV"
          echo "NOX_SDK_REF=${sdk}" >> "$GITHUB_ENV"

      - name: Checkout darkpool
        uses: actions/checkout@v4
        with:
          path: darkpool
          persist-credentials: false
      - name: Checkout nox
        uses: actions/checkout@v4
        with:
          repository: hisoka-io/nox
          ref: ${{ env.NOX_REF }}
          path: nox
          persist-credentials: false
      - name: Checkout nox-sdk
        uses: actions/checkout@v4
        with:
          repository: hisoka-io/nox-sdk
          ref: ${{ env.NOX_SDK_REF }}
          path: nox-sdk
          persist-credentials: false
      - name: Verify the checked-out commits
        run: |
          test "$(git -C nox rev-parse HEAD)" = "$NOX_REF" \
            || { echo "::error::nox is not at commit $NOX_REF"; exit 1; }
          test "$(git -C nox-sdk rev-parse HEAD)" = "$NOX_SDK_REF" \
            || { echo "::error::nox-sdk is not at commit $NOX_SDK_REF"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: darkpool/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: darkpool/pnpm-lock.yaml
      - uses: ./darkpool/.github/actions/setup-nargo
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Verify Rust version
        run: rustc --version | grep -F "rustc 1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust
          key: ${{ env.NOX_REF }}
          workspaces: nox -> target
          cache-on-failure: true
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.3.2
      - name: Verify Anvil version
        run: 'anvil --version | grep -F "anvil Version: 1.3.2"'

      - name: Build darkpool
        working-directory: darkpool
        run: |
          bash scripts/check-node.sh
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the SDK WASM bindings for Node
        working-directory: nox-sdk
        run: |
          source packages/anon-rpc-worker/scripts/toolchain.env
          source packages/anon-rpc-worker/scripts/lib/pinned-tools.sh
          fail() { echo "::error::$*"; exit 1; }
          arch=x86_64
          fetch_tools "$RUNNER_TEMP/nox-tools"
          export PATH="$RUNNER_TEMP/nox-tools/bin:$RUNNER_TEMP/nox-tools/binaryen/bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm --filter @hisoka-io/nox-wasm --fail-if-no-match run build:node
          test -f packages/nox-wasm/pkg-node/nox_wasm.js -a -f packages/nox-wasm/pkg-node/nox_wasm_bg.wasm \
            || { echo "::error::nox-wasm did not produce its Node bindings"; exit 1; }

      # A step of its own, so a later test failure still leaves the release build in the cache.
      - name: Build the node and the mesh fixture
        working-directory: nox
        env:
          RUSTFLAGS: ${{ env.NOX_RUSTFLAGS }}
        run: |
          cargo build --release --bin nox
          cargo build --release -p nox-sim --bin nox_paid_mesh_server

      - name: Run the paid mesh (must execute, never skip)
        working-directory: darkpool/packages/evm-contracts
        env:
          RUSTFLAGS: ${{ env.NOX_RUSTFLAGS }}
          NOX_REPO_DIR: ${{ github.workspace }}/nox
          NOX_SDK_DIR: ${{ github.workspace }}/nox-sdk
        run: |
          set -o pipefail
          rc=0
          bash test/nox/run_mixnet_e2e.sh 2>&1 | tee "$RUNNER_TEMP/paid-e2e.log" || rc=$?
          test "$rc" -eq 0 || { echo "::error::paid mesh run exited $rc"; exit 1; }
          # Mocha exits 0 on a suite that skipped itself, so the summary is asserted as well.
          grep -qE "^[[:space:]]*${EXPECTED_PASSING} passing" "$RUNNER_TEMP/paid-e2e.log" \
            || { echo "::error::paid mesh did not report exactly ${EXPECTED_PASSING} passing cases"; exit 1; }
          if grep -qE "^[[:space:]]*[0-9]+ (pending|failing)" "$RUNNER_TEMP/paid-e2e.log"; then
            echo "::error::paid mesh reported pending or failing cases"
            exit 1
          fi
          test "$(grep -c '^\[gas\] case=' "$RUNNER_TEMP/paid-e2e.log")" -ge "$EXPECTED_PASSING" \
            || { echo "::error::paid mesh did not record gas for every case"; exit 1; }

      - name: Upload the paid mesh logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paid-mesh-logs
          path: |
            ${{ runner.temp }}/paid-e2e.log
            /tmp/howl-nox-paid-e2e-failure.*.log
          if-no-files-found: ignore
          retention-days: 14
